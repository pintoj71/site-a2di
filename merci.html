<style>
:root{--navy:#0B1D3A;--gold:#C8A45A;--gold-light:#E8CE8A;--cream:#FAF7F0;--white:#FFF;--text-light:rgba(255,255,255,.6);--green:#5CDB95}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
background:linear-gradient(165deg,var(--navy) 0%,#0D2440 45%,#14365E 100%);color:var(--white);text-align:center}
.card{max-width:520px;width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(200,164,90,.2);
border-radius:20px;padding:48px 40px;backdrop-filter:blur(8px)}
.logo{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:800;color:var(--white);letter-spacing:-.5px;margin-bottom:32px;display:inline-block;text-decoration:none}

.check{width:88px;height:88px;border-radius:50%;background:rgba(46,125,91,.15);border:1px solid rgba(92,219,149,.3);
display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:var(--green);margin:0 auto 28px}
h1{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;margin-bottom:16px;line-height:1.25}
p{color:var(--text-light);font-size:1.05rem;line-height:1.7;margin-bottom:12px}
.highlight{color:var(--gold-light);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:32px;background:var(--gold);color:var(--navy);
padding:16px 36px;border-radius:10px;font-weight:700;font-size:1rem;text-decoration:none;transition:all .3s}
.btn:hover{background:var(--gold-light);transform:translateY(-2px);box-shadow:0 8px 30px rgba(200,164,90,.3)}
.contact{margin-top:28px;padding-top:24px;border-top:1px solid rgba(255,255,255,.08);font-size:.9rem;color:rgba(255,255,255,.5)}
.contact a{color:var(--gold-light);text-decoration:none;font-weight:600}
</style>
</head>

<div class="card">
<a href="/" class="logo">A2<span>DI</span></a>
